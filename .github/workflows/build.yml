name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35" || {
            echo "Android API 35 is not installed on this runner." >&2
            find "$ANDROID_SDK_ROOT/platforms" -maxdepth 1 -mindepth 1 -type d -print 2>/dev/null || true
            exit 1
          }
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" || {
            echo "Android Build Tools 35.0.0 are not installed on this runner." >&2
            find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d -print 2>/dev/null || true
            exit 1
          }
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          java -version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayTimeline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
