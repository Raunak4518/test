name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing a release needs write access to the repository contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Version for this build
        shell: bash
        run: |
          # Rises with every run so the app's updater sees each build as newer.
          echo "CHRONORA_VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release file
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" "dist/chronora-${CHRONORA_VERSION_CODE}.apk"
          git log -1 --pretty=%B > dist/notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chronora-apk
          path: dist/*.apk
          if-no-files-found: error

      # The in-app "Update app" button reads the latest release of this repository.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.CHRONORA_VERSION_CODE }}
          name: Chronora 1.0.${{ env.CHRONORA_VERSION_CODE }}
          body_path: dist/notes.md
          files: dist/chronora-${{ env.CHRONORA_VERSION_CODE }}.apk
          make_latest: true
